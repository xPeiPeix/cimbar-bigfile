<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cimbar-bigfile · Reassembler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px;
      overflow-y: auto;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .topbar {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 24px;
    }
    .title-wrap { min-width: 0; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; color: #5fbcff; }
    .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
    .topbar .sub { margin-bottom: 0; }
    .locale-button {
      flex: 0 0 auto; min-width: 54px; padding: 7px 12px;
      background: rgba(255,255,255,0.08); color: #ddd;
      border: 1px solid #555; border-radius: 4px;
      cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .locale-button:hover { background: rgba(255,255,255,0.14); border-color: #777; }
    .locale-button:focus-visible { outline: 2px solid #5fbcff; outline-offset: 2px; }

    #dropzone {
      border: 3px dashed #555;
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 24px;
    }
    #dropzone:hover, #dropzone.dragover {
      border-color: #5fbcff;
      background: rgba(95, 188, 255, 0.05);
    }
    #dropzone .icon { font-size: 48px; opacity: 0.5; margin-bottom: 12px; }
    #dropzone .hint { color: #aaa; margin-bottom: 4px; }
    #dropzone .sub2 { font-size: 12px; color: #777; }

    .filelist {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      max-height: 240px;
      overflow-y: auto;
    }
    .filelist .row {
      display: flex; gap: 8px; align-items: center;
      padding: 4px 8px; font-size: 13px; font-family: monospace;
      border-bottom: 1px solid #2a2a3e;
    }
    .filelist .row:last-child { border-bottom: none; }
    .filelist .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filelist .size { color: #888; }
    .filelist .badge {
      padding: 2px 8px; border-radius: 12px; font-size: 11px;
      text-transform: uppercase; font-weight: 600;
    }
    .filelist .badge.manifest { background: #5fbcff; color: #0a0a1a; }
    .filelist .badge.chunk { background: #50c878; color: #0a0a1a; }
    .filelist .badge.unknown { background: #555; color: #ccc; }

    .info {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .info h2 { font-size: 14px; color: #5fbcff; margin-bottom: 12px; font-weight: 500; }
    .info-grid {
      display: grid; grid-template-columns: auto 1fr;
      gap: 4px 12px; font-size: 13px;
    }
    .info-grid .k { color: #888; }
    .info-grid .v { font-family: monospace; }
    .info-grid .v.ok { color: #50c878; }
    .info-grid .v.err { color: #e74c3c; }
    .info-grid .v.warn { color: #f5b942; }

    .actions {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .actions button {
      padding: 8px 16px; background: #4a90e2; color: white; border: none; border-radius: 4px;
      cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .actions button:hover:not(:disabled) { background: #5fa3f5; }
    .actions button:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
    .actions button.secondary { background: #555; }
    .actions button.secondary:hover:not(:disabled) { background: #666; }

    .log {
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      color: #888;
    }
    .log .ok { color: #50c878; }
    .log .err { color: #e74c3c; }
    .log .warn { color: #f5b942; }

    .progress-bar {
      height: 8px; background: #2a2a3e; border-radius: 4px; overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar .fill {
      height: 100%; background: linear-gradient(90deg, #4a90e2, #5fbcff);
      width: 0%; transition: width 0.2s;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <div class="title-wrap">
      <h1 id="pageHeading">📥 cimbar-bigfile · Reassembler</h1>
      <div class="sub" id="pageSubtitle">Drop all files received by CFC below. The manifest is detected automatically and the original file is reassembled.</div>
    </div>
    <button id="btnLocale" class="locale-button" type="button" title="Switch to Chinese" aria-label="Switch to Chinese">中文</button>
  </div>

  <div id="dropzone" role="button" tabindex="0" title="Select received files" aria-label="Select received files">
    <div class="icon">📁</div>
    <div class="hint" id="dropHint">Drop all received files here (manifest.json + *.partXX.bin)</div>
    <div class="sub2" id="dropSub">Select multiple files · Automatic ordering · Everything stays in your browser</div>
    <input type="file" id="fileInput" multiple style="display:none;" aria-label="Select received files">
  </div>

  <div id="filelist" class="filelist" style="display:none;"></div>
  <div id="info" class="info" style="display:none;"></div>

  <div class="actions">
    <button id="btnReassemble" type="button" title="Reassemble, verify, and download the original file" disabled>Reassemble + Verify + Download</button>
    <button id="btnClear" class="secondary" type="button" title="Clear selected files and logs" disabled>Clear</button>
  </div>

  <div class="progress-bar" style="display:none;" id="pbarBox">
    <div class="fill" id="pbar"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<script>

    chunkSizeMismatch: '分块 {index} 大小不匹配：文件={actual}，预期={expected}',
    chunkShaMismatch: '分块 {index} 的 SHA256 不匹配！预期={expected}，实际={actual}',
    fileCorrupted: '文件“{filename}”可能已损坏，请重新接收该分块。',
    chunkOk: '分块 {index} 校验通过（{size}，{sha}…）',
    concatenating: '正在拼接分块……',
    totalSizeMismatch: '总大小不匹配：拼接后={actual}，manifest={expected}',
    verifyingFullSha: '正在校验完整文件 SHA256……',
    fullShaMismatch: '完整文件 SHA256 不匹配！预期={expected}，实际={actual}',
    fullShaImpossible: '所有分块 SHA256 均通过时不应出现此问题，manifest 可能已损坏。',
    fullShaVerified: '完整文件 SHA256 校验通过：{sha}',
    downloadDone: '✅ 完成！已下载为“{filename}”',
    cleared: '已清空',
    ready: '准备就绪。请拖入 manifest.json 和所有 *.partXX.bin 文件。',
  },
};

function $(id) { return document.getElementById(id); }
function loadLocale() {
  try {
    const saved = localStorage.getItem(LOCALE_KEY);
    if (SUPPORTED_LOCALES.has(saved)) return saved;
  } catch (e) {
    console.warn('[reassemble] Unable to read locale preference:', e);
  }
  return 'en';
}
let locale = loadLocale();
function t(key, params = {}) {
  const template = TRANSLATIONS[locale][key] ?? TRANSLATIONS.en[key] ?? key;
  return template.replace(/\{(\w+)\}/g, (match, name) => (
    Object.prototype.hasOwnProperty.call(params, name) ? String(params[name]) : match
  ));
}
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(2) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}
function appendLogEntry(entry) {
  const el = $('log');
  const div = document.createElement('div');
  if (entry.cls) div.className = entry.cls;
  const time = new Date(entry.timestamp).toLocaleTimeString(locale);
  div.textContent = `[${time}] ${t(entry.key, entry.params)}`;
  el.appendChild(div);
}
function renderLogs() {
  const el = $('log');
  el.innerHTML = '';
  for (const entry of State.logs) appendLogEntry(entry);
  el.scrollTop = el.scrollHeight;
}
function log(key, params = {}, cls) {
  const entry = { key, params, cls, timestamp: Date.now() };
  State.logs.push(entry);
  appendLogEntry(entry);
  $('log').scrollTop = $('log').scrollHeight;
  console.log('[reassemble] ' + t(key, params));
}
async function sha256Hex(uint8) {
  const buf = await crypto.subtle.digest('SHA-256', uint8);
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

// ============= 状态 =============
const State = {
  files: [],          // 用户拖入的所有 File 对象
  manifestFile: null,
  manifest: null,
  partFiles: new Map(), // index -> File (按 chunks[].index 索引)
  unknownFiles: [],
  logs: [],
};

function applyLocale() {
  document.documentElement.lang = locale;
  document.title = t('pageTitle');
  $('pageHeading').textContent = t('pageHeading');
  $('pageSubtitle').textContent = t('pageSubtitle');
  $('dropHint').textContent = t('dropHint');
  $('dropSub').textContent = t('dropSub');
  $('dropzone').title = t('selectFiles');
  $('dropzone').setAttribute('aria-label', t('selectFiles'));
  $('fileInput').setAttribute('aria-label', t('selectFiles'));
  $('btnReassemble').textContent = t('reassembleButton');
  $('btnReassemble').title = t('reassembleTitle');
  $('btnReassemble').setAttribute('aria-label', t('reassembleTitle'));
  $('btnClear').textContent = t('clearButton');
  $('btnClear').title = t('clearTitle');
  $('btnClear').setAttribute('aria-label', t('clearTitle'));
  $('btnLocale').textContent = t('localeButton');
  $('btnLocale').title = t('localeTitle');
  $('btnLocale').setAttribute('aria-label', t('localeTitle'));
  renderFileList();
  renderInfo();
  renderLogs();
}

function setLocale(nextLocale) {
  if (!SUPPORTED_LOCALES.has(nextLocale) || nextLocale === locale) return;
  locale = nextLocale;
  try {
    localStorage.setItem(LOCALE_KEY, locale);
  } catch (e) {
    console.warn('[reassemble] Unable to save locale preference:', e);
  }
  applyLocale();
}

// ============= 文件分类 =============
async function ingest(files) {
  for (const f of files) {
    State.files.push(f);
  }
  await classifyFiles();
  await tryParseManifest();
  await recoverPartFilesFromManifest();
  renderFileList();
  renderInfo();
  $('btnReassemble').disabled = !canReassemble();
  $('btnClear').disabled = State.files.length === 0;
}

async function classifyFiles() {
  // 简单按文件名识别
  State.manifestFile = null;
  State.partFiles = new Map();
  State.unknownFiles = [];

  for (const f of State.files) {
    if (/^manifest\.json$/i.test(f.name)) {
      State.manifestFile = f;
    } else {
      // 尝试匹配 *.partXX.bin
      const m = f.name.match(/\.part(\d+)\.bin$/i);
      if (m) {
        const idx = parseInt(m[1], 10);
        State.partFiles.set(idx, f);
      } else {
        State.unknownFiles.push(f);
      }
    }
  }
}

async function tryParseManifest() {
  if (!State.manifestFile) {
    for (const f of State.unknownFiles) {
      const m = await parseManifestCandidate(f);
      if (m) {
        State.manifestFile = f;
        State.manifest = m;
        State.unknownFiles = State.unknownFiles.filter(x => x !== f);
        log('manifestRecovered', { filename: f.name }, 'warn');
        log('manifestOk', {
          filename: m.filename,
          size: fmtBytes(m.total_size),
          count: m.chunk_count,
        }, 'ok');
        return;
      }
    }
    State.manifest = null;
    return;
  }
  const m = await parseManifestCandidate(State.manifestFile);
  if (m) {
    State.manifest = m;
    log('manifestOk', {
      filename: m.filename,
      size: fmtBytes(m.total_size),
      count: m.chunk_count,
    }, 'ok');
  } else {
    State.manifest = null;
  }
}

async function parseManifestCandidate(file) {
  if (file.size > 1024 * 1024) return null;
  try {
    const txt = await file.text();
    const m = JSON.parse(txt);
    if (m.tool !== 'cimbar-bigfile') {
      log('manifestToolUnexpected', { tool: m.tool }, 'warn');
    }
    if (m.version !== 1) {
      log('manifestVersionUnsupported', { version: m.version }, 'err');
      return null;
    }
    if (!Array.isArray(m.chunks) || m.chunks.length !== m.chunk_count) {
      log('manifestMalformed', { length: m.chunks?.length, count: m.chunk_count }, 'err');
      return null;
    }
    return m;
  } catch (e) {
    if (/^manifest\.json$/i.test(file.name)) {
      log('manifestParseFailed', { error: e.message }, 'err');
    }
    return null;
  }
}

async function recoverPartFilesFromManifest() {
  if (!State.manifest) return;

  const known = new Set([State.manifestFile, ...State.partFiles.values()]);
  const candidates = State.files.filter(f => !known.has(f));
  const missing = new Map();
  for (let i = 0; i < State.manifest.chunk_count; i++) {
    if (!State.partFiles.has(i)) {
      const chunk = State.manifest.chunks[i];
      missing.set(i, chunk);
    }
  }
  if (missing.size === 0) {
    State.unknownFiles = candidates;
    return;
  }

  let recovered = 0;
  for (const f of candidates) {
    const matchesBySize = Array.from(missing.entries()).filter(([, chunk]) => chunk.size === f.size);
    if (matchesBySize.length === 0) continue;

    const bytes = new Uint8Array(await f.arrayBuffer());
    const sha = await sha256Hex(bytes);
    const match = matchesBySize.find(([, chunk]) => chunk.sha256 === sha);
    if (!match) continue;

    const [idx] = match;
    State.partFiles.set(idx, f);
    missing.delete(idx);
    recovered++;
  }

  State.unknownFiles = State.files.filter(f => {
    if (f === State.manifestFile) return false;
    return !Array.from(State.partFiles.values()).includes(f);
  });
  if (recovered > 0) {
    log('partsRecovered', { count: recovered }, 'warn');
  }
}

function canReassemble() {
  if (!State.manifest) return false;
  for (let i = 0; i < State.manifest.chunk_count; i++) {
    if (!State.partFiles.has(i)) return false;
  }
  return true;
}

function renderFileList() {
  const el = $('filelist');
  if (State.files.length === 0) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  el.innerHTML = '';
  for (const f of State.files) {
    const row = document.createElement('div');
    row.className = 'row';
    let badge, badgeClass;
    if (f === State.manifestFile) {
      badge = t('badgeManifest'); badgeClass = 'manifest';
    } else if (Array.from(State.partFiles.values()).includes(f)) {
      const idx = Array.from(State.partFiles.entries()).find(([k, v]) => v === f)[0];
      badge = t('badgePart', { index: idx }); badgeClass = 'chunk';
    } else {
      badge = t('badgeUnknown'); badgeClass = 'unknown';
    }
    row.innerHTML = `
      <span class="badge ${badgeClass}">${badge}</span>
      <span class="name">${escapeHtml(f.name)}</span>
      <span class="size">${fmtBytes(f.size)}</span>
    `;
    el.appendChild(row);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderInfo() {
  const el = $('info');
  if (!State.manifest) {
    el.style.display = 'none';
    return;
  }
  el.style.display = 'block';
  const m = State.manifest;
  const missing = [];
  for (let i = 0; i < m.chunk_count; i++) {
    if (!State.partFiles.has(i)) missing.push(i);
  }
  const ok = missing.length === 0;
  el.innerHTML = `
    <h2>${t('manifestInfoTitle')}</h2>
    <div class="info-grid">
      <span class="k">${t('originalFilename')}</span> <span class="v">${escapeHtml(m.filename)}</span>
      <span class="k">${t('originalSize')}</span> <span class="v">${fmtBytes(m.total_size)}</span>
      <span class="k">${t('originalSha256')}</span> <span class="v">${escapeHtml(String(m.sha256))}</span>
      <span class="k">${t('chunkSize')}</span> <span class="v">${fmtBytes(m.chunk_size)}</span>
      <span class="k">${t('chunkCount')}</span> <span class="v">${m.chunk_count}</span>
      <span class="k">${t('encodeIdBase')}</span> <span class="v">${escapeHtml(String(m.encode_id_base))}</span>
      <span class="k">${t('receivedChunks')}</span> <span class="v ${ok ? 'ok' : 'err'}">${m.chunk_count - missing.length}/${m.chunk_count}</span>
      ${missing.length > 0 ? `<span class="k">${t('missingChunks')}</span> <span class="v err">${missing.join(', ')}</span>` : ''}
      <span class="k">${t('unknownFiles')}</span> <span class="v ${State.unknownFiles.length === 0 ? 'ok' : 'warn'}">${State.unknownFiles.length}</span>
    </div>
  `;
}

// ============= 拼接 + 校验 =============
async function reassemble() {
  if (!canReassemble()) {
    log('cannotReassemble', {}, 'err');
    return;
  }
  $('btnReassemble').disabled = true;
  $('btnClear').disabled = true;
  $('pbarBox').style.display = 'block';
  $('pbar').style.width = '0%';

  const m = State.manifest;
  const total = m.total_size;
  log('reassemblyStart', { filename: m.filename, size: fmtBytes(total) }, 'ok');

  // 1. 校验每块 SHA256 + 收集字节
  const buffers = [];
  for (let i = 0; i < m.chunk_count; i++) {
    const expected = m.chunks[i];
    const file = State.partFiles.get(i);
    if (!file) {
      log('missingChunk', { index: i }, 'err');
      $('btnReassemble').disabled = false;
      return;
    }
    const bytes = new Uint8Array(await file.arrayBuffer());
    if (bytes.length !== expected.size) {
      log('chunkSizeMismatch', { index: i, actual: bytes.length, expected: expected.size }, 'err');
      $('btnReassemble').disabled = false;
      return;
    }
    const sha = await sha256Hex(bytes);
    if (sha !== expected.sha256) {
      log('chunkShaMismatch', { index: i, expected: expected.sha256, actual: sha }, 'err');
      log('fileCorrupted', { filename: file.name }, 'err');
      $('btnReassemble').disabled = false;
      return;
    }
    log('chunkOk', { index: i, size: fmtBytes(bytes.length), sha: sha.substring(0, 12) }, 'ok');
    buffers.push(bytes);

    const pct = ((i + 1) / m.chunk_count) * 50; // 0-50%
    $('pbar').style.width = pct + '%';
  }

  // 2. 拼接
  log('concatenating', {}, 'ok');
  const out = new Uint8Array(total);
  let offset = 0;
  for (const buf of buffers) {
    out.set(buf, offset);
    offset += buf.length;
  }
  if (offset !== total) {
    log('totalSizeMismatch', { actual: offset, expected: total }, 'err');
    $('btnReassemble').disabled = false;
    return;
  }
  $('pbar').style.width = '75%';

  // 3. 全文 SHA256 校验
  log('verifyingFullSha', {}, 'ok');
  const finalSha = await sha256Hex(out);
  if (finalSha !== m.sha256) {
    log('fullShaMismatch', { expected: m.sha256, actual: finalSha }, 'err');
    log('fullShaImpossible', {}, 'err');
    $('btnReassemble').disabled = false;
    return;
  }
  $('pbar').style.width = '100%';
  log('fullShaVerified', { sha: finalSha }, 'ok');

  // 4. 触发下载
  const blob = new Blob([out], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = m.filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  log('downloadDone', { filename: m.filename }, 'ok');
  $('btnReassemble').disabled = false;
  $('btnClear').disabled = false;
}

// ============= 事件绑定 =============
$('dropzone').addEventListener('click', () => $('fileInput').click());
$('dropzone').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    $('fileInput').click();
  }
});
$('fileInput').addEventListener('change', async (e) => {
  if (e.target.files && e.target.files.length > 0) {
    await ingest(Array.from(e.target.files));
  }
  e.target.value = '';
});
$('dropzone').addEventListener('dragover', (e) => {
  e.preventDefault();
  $('dropzone').classList.add('dragover');
});
$('dropzone').addEventListener('dragleave', () => {
  $('dropzone').classList.remove('dragover');
});
$('dropzone').addEventListener('drop', async (e) => {
  e.preventDefault();
  $('dropzone').classList.remove('dragover');
  if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    await ingest(Array.from(e.dataTransfer.files));
  }
});

$('btnLocale').addEventListener('click', () => {
  setLocale(locale === 'en' ? 'zh-CN' : 'en');
});
$('btnReassemble').addEventListener('click', reassemble);
$('btnClear').addEventListener('click', () => {
  State.files = [];
  State.manifestFile = null;
  State.manifest = null;
  State.partFiles = new Map();
  State.unknownFiles = [];
  $('filelist').style.display = 'none';
  $('info').style.display = 'none';
  $('pbarBox').style.display = 'none';
  $('pbar').style.width = '0%';
  $('btnReassemble').disabled = true;
  $('btnClear').disabled = true;
  State.logs = [];
  renderLogs();
  log('cleared');
});

// 防止整页拖拽默认行为
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => e.preventDefault());

applyLocale();
log('ready');
</script>
