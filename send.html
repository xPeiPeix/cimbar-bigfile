<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>cimbar-bigfile · 发送端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #header {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid #333;
      flex-wrap: wrap;
    }
    #header h1 { font-size: 14px; font-weight: 500; color: #aaa; white-space: nowrap; }

    /* 文件信息卡 — 现居左栏顶部, 竖向 label/value 列表 (原在顶栏横排, 移走后顶栏不再换行). */
    .file-meta { font-size: 11px; color: #888; display: flex; flex-direction: column; gap: 4px; }
    .file-meta .mrow { display: flex; justify-content: space-between; gap: 8px; }
    .file-meta .mrow b { color: #5fbcff; font-weight: 500; text-align: right; word-break: break-all; }
    #ctrl { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    #ctrl label { font-size: 12px; color: #aaa; }
    #ctrl select, #ctrl input { padding: 4px 8px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; font-size: 12px; }
    #ctrl button {
      padding: 6px 16px; background: #4a90e2; color: white; border: none; border-radius: 4px;
      cursor: pointer; font-size: 13px; font-weight: 500;
    }
    #ctrl button:hover:not(:disabled) { background: #5fa3f5; }
    #ctrl button:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
    #ctrl button.stop { background: #e74c3c; }
    #ctrl button.stop:hover:not(:disabled) { background: #f15a4a; }

    /* main: 三栏(横屏)/上下(竖屏) 响应式容器.
       canvas 在中间按固有比例(_idealRatio)最大化, 两侧 panel flex:1 自动平分剩余空间.
       fitCanvas 保证 canvas + 2×MIN_PANEL 不超过可用空间, 故 center 用 flex:0 0 auto 不压缩, 无循环依赖. */
    #main {
      flex: 1; position: relative; display: flex; overflow: hidden;
      flex-direction: row; align-items: stretch;
    }
    #main.portrait { flex-direction: column; }

    #center {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }

    /* 左右栏(横屏)/上下栏(竖屏): 放文件信息/跳转列表/确认/进度. 内容超出时各自滚动. */
    .side-panel {
      flex: 1 1 0; min-width: 0; min-height: 0;
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px 14px; overflow-y: auto;
      background: rgba(0,0,0,0.22);
    }
    #left-panel { border-right: 1px solid #333; }
    #right-panel { border-left: 1px solid #333; }
    #main.portrait #left-panel { border-right: none; border-bottom: 1px solid #333; }
    #main.portrait #right-panel { border-left: none; border-top: 1px solid #333; }

    .panel-title {
      font-size: 12px; color: #aaa; font-weight: 600;
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
      border-bottom: 1px solid #2a2a3e; padding-bottom: 4px;
    }
    .panel-title .sub { font-size: 10px; color: #777; font-weight: 400; }

    #dropzone {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      border: 3px dashed #555; margin: 24px; border-radius: 12px;
      /* 不透明深色背景遮挡底层 canvas (前一次传输的码图), 否则 dropzone 重新出现时会看到重叠 */
      background: rgba(15, 25, 50, 0.94);
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer; z-index: 5;
    }
    #dropzone:hover, #dropzone.dragover { border-color: #5fbcff; background: rgba(30, 60, 110, 0.94); }
    #dropzone .icon { font-size: 48px; opacity: 0.5; }
    #dropzone .hint { color: #aaa; }
    #dropzone .sub { font-size: 12px; color: #777; }
    #dropzone.hidden { display: none; }

    /* canvas 显式尺寸由 fitCanvas() 计算，不能用 max-width/height
       因为 canvas 长宽比由 cimbar wasm 决定（_cimbare_get_aspect_ratio），
       max-* 各自独立约束会破坏比例 → CFC 扫不到完整定位 marker.
       默认 visibility: hidden — 只在 startTransmission 时显示, 防止 dropzone margin 区域露出旧码图 */
    #canvas { display: block; visibility: hidden; }

    /* progress — 进度信息, 现居右栏. 右栏宽度固定(flex:1), 内容显隐不影响 center 宽度,
       故 canvas 不会因 progress 显隐而尺寸跳变, 可放心用 display 切换. */
    #progress {
      background: rgba(0,0,0,0.5); padding: 10px 12px; font-size: 12px;
      display: none; border: 1px solid #333; border-radius: 6px;
    }
    #progress.active { display: block; }
    #progress .row { display: flex; flex-direction: column; gap: 6px; }
    #progress .row span { display: flex; justify-content: space-between; gap: 12px; }
    #progress .bar-bg {
      height: 5px; background: #333; border-radius: 2px; overflow: hidden; margin-top: 10px;
    }
    #progress .bar-fg {
      height: 100%; background: linear-gradient(90deg, #4a90e2, #5fbcff);
      width: 0%; transition: width 0.2s;
    }
    #progress .label { color: #aaa; }
    #progress .value { color: #5fbcff; font-weight: 500; }

    /* chunkJumpBar — 跳转目标列表 (multi 模式专用), 现居左栏内的垂直全宽按钮列表.
       单击=跳转, 双击=锁定该块. flex:1 占满左栏剩余高度, 内容超出时自身滚动 (500MB→50 块也不撑爆).
       竖屏时左栏在顶部高度有限, 列表改横向 wrap 网格. */
    #chunkJumpBar {
      flex: 1 1 auto; min-height: 60px;
      display: none;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }
    #chunkJumpBar.visible { display: flex; }
    #main.portrait #chunkJumpBar { flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    #chunkJumpBar button {
      padding: 6px 10px;
      width: 100%;
      text-align: left;
      font-size: 12px;
      background: #2a2a3e;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, border-left-width 0.15s;
    }
    #main.portrait #chunkJumpBar button { width: auto; min-width: 78px; text-align: center; }
    #chunkJumpBar button:hover:not(:disabled) {
      background: #3a3a5e;
      border-color: #5fbcff;
    }
    /* active: 实际正在播放的块 (跟随 State.curChunkIndex, 真正切到才点亮 — 不再领先于实际播放). */
    #chunkJumpBar button.active {
      background: #4a90e2;
      color: #fff;
      border-color: #5fbcff;
      font-weight: 600;
    }
    /* locked: 双击锁定的块. 琥珀色左边框 + 淡琥珀背景着色, 视觉上比单纯字形/边框更醒目. 🔒 字形仍由 JS 写入 textContent. */
    #chunkJumpBar button.locked {
      border-left: 3px solid #f5b942;
      background: rgba(245, 185, 66, 0.18);
    }
    /* active 时蓝底优先 (active = 屏幕实际播放的块, 需最强视觉), 琥珀左边框仍保留作锁定指示 */
    #chunkJumpBar button.active.locked {
      background: #4a90e2;
      border-left: 3px solid #f5b942;
    }
    /* completed 时绿底为主, 但锁定保留可见性: 琥珀左边框 + 略深琥珀背景叠加 (避免锁定指示被绿色完全吃掉) */
    #chunkJumpBar button.completed.locked {
      background: rgba(245, 185, 66, 0.28);
      border-left: 3px solid #f5b942;
    }
    /* completed: 用户在 CFC 完成保存后手动标记. 绿底 + ✓ 前缀, 与 active/locked 独立. */
    #chunkJumpBar button.completed {
      background: #1f5e3a;
      color: #b8efc4;
      border-color: #50c878;
    }
    #chunkJumpBar button.completed::before { content: '✓ '; }
    #chunkJumpBar button.completed:hover:not(:disabled) {
      background: #2a6e48;
      border-color: #66d690;
    }
    #chunkJumpBar button.active.completed {
      background: #4a90e2;
      color: #fff;
      border-color: #50c878;
    }
    /* 三态叠加: active=屏幕正在播 + completed=用户已确认保存 + locked=锁定; 蓝底+绿边 specificity (0,2,0) 与 .completed.locked 平局会吃掉琥珀左边框,
       这条 (0,3,0) 必胜, 保留琥珀左边框 = 任何状态下锁定指示都不消失. */
    #chunkJumpBar button.active.completed.locked {
      background: #4a90e2;
      color: #fff;
      border-color: #50c878;
      border-left: 3px solid #f5b942;
    }
    #chunkJumpBar button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* chunkConfirm — 唯一可信"完成"信号是 CFC 弹 ACTION_CREATE_DOCUMENT 对话框;
       用户在 CFC 看到对话框并完成保存后点这个绿主按钮, 当前块标 ✓ + 自动跳下一未完成. */
    #chunkConfirm {
      background: rgba(80, 200, 120, 0.08);
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      border: 1px solid #2a4a3a;
      border-radius: 6px;
    }
    #chunkConfirm.visible { display: flex; }
    #chunkConfirm button.primary {
      padding: 8px 16px;
      background: #50c878;
      color: #0a0a1a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      /* normal + line-height 1.3 允许文案在窄 panel (minPanel=120) 下换行, 不再 nowrap 撑爆 panel 宽度 */
      white-space: normal;
      line-height: 1.3;
    }
    #chunkConfirm button.primary:hover:not(:disabled) { background: #66d690; }
    #chunkConfirm button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    #chunkConfirm button.secondary {
      padding: 5px 10px;
      background: #555;
      color: #ccc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      white-space: nowrap;
    }
    #chunkConfirm button.secondary:hover:not(:disabled) { background: #666; }
    #chunkConfirm button.secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    #chunkConfirm .stats { color: #5fbcff; font-size: 12px; font-weight: 500; white-space: nowrap; }
    #chunkConfirm .hint { color: #888; font-size: 11px; flex: 1; min-width: 200px; }

    #log {
      position: absolute; top: 60px; right: 16px;
      max-width: 320px; max-height: 200px; overflow-y: auto;
      background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 6px;
      font-family: monospace; font-size: 11px; color: #888;
      backdrop-filter: blur(4px); display: none;
    }
    #log.active { display: block; }
    #log .err { color: #e74c3c; }
    #log .ok { color: #5fbcff; }
  </style>
</head>
<body>

<div id="header">
  <h1>📡 cimbar-bigfile</h1>
  <div id="ctrl">
    <label>预设</label>
    <select id="preset" title="按场景一键切换 FPS+冗余 (选自定义后可手动微调)">
      <option value="balanced" selected>默认 (推荐)</option>
      <option value="aggressive">激进 (固定支架+好光线)</option>
      <option value="conservative">保守 (手持/差光线)</option>
      <option value="custom">自定义</option>
    </select>
    <label>块大小</label>
    <select id="chunkSize" disabled>
      <option value="10485760" selected>10 MB</option>
      <option value="8388608">8 MB</option>
      <option value="12582912">12 MB</option>
      <option value="5242880">5 MB</option>
    </select>
    <label>FPS</label>
    <input type="number" id="fps" min="5" max="20" value="15" style="width: 50px;">
    <label>冗余</label>
    <input type="number" id="redundancy" min="1.0" max="5.0" step="0.1" value="2.0" style="width: 60px;" title="fountain code 冗余倍数. libcimbar 作者 confirms no penalty for higher values (sz3/libcimbar#165): 多余冗余只增加发送端发帧总数, 不影响 CFC 接收完成时间. 推荐: 1.5x 安全 / 2x 默认 / 3-4x 极端环境">
    <span id="throughputHint" title="物理上限 = FPS × 7500 B; 区间下限 = 上限 / 冗余 (跑满冗余时的有效吞吐). 实测受光线/对焦影响" style="color: #5fbcff; font-size: 12px; white-space: nowrap;">预期 ~73–110 KB/s</span>
    <button id="btnStart" disabled>开始传输</button>
    <button id="btnStop" class="stop" disabled>停止</button>
    <button id="btnDebug" title="切换日志显示">🐛</button>
  </div>
</div>

<div id="main">
  <div id="dropzone">
    <div class="icon">📁</div>
    <div class="hint">拖入文件 / 点击选择</div>
    <div class="sub">任意大小，会自动切成 10 MB 的块依次发送</div>
    <input type="file" id="fileInput" style="display:none;">
  </div>

  <div id="left-panel" class="side-panel">
    <div class="file-meta">
      <div class="mrow"><span>文件</span><b id="m_filename">—</b></div>
      <div class="mrow"><span>大小</span><b id="m_filesize">—</b></div>
      <div class="mrow"><span>SHA256</span><b id="m_filehash">—</b></div>
      <div class="mrow"><span>📱 手机应收</span><b id="m_chunkcount">—</b></div>
      <div class="mrow"><span>encode_id</span><b id="m_encodeid">—</b></div>
    </div>
    <div class="panel-title" id="jumpTitle">跳转目标 <span class="sub">单击跳 · 双击锁 🔒</span></div>
    <div id="chunkJumpBar"></div>
  </div>

  <div id="center">
    <canvas id="canvas"></canvas>
  </div>

  <div id="right-panel" class="side-panel">
    <div id="chunkConfirm">
      <button id="btnConfirmChunk" type="button" class="primary">✅ 已保存, 跳下一块</button>
      <span class="stats" id="confirmStats">0 / 0 已保存</span>
      <span class="hint">📱 CFC 弹出"保存到哪里"对话框并完成保存后, 点这个按钮标记当前块为已保存并跳到下一个未完成块</span>
      <button id="btnResetCompleted" type="button" class="secondary" title="清空当前文件的已保存进度">↺ 清空</button>
    </div>

    <div id="progress">
      <div id="p_hint" style="margin-bottom: 6px; color: #f5b942; font-weight: 500; text-align: center;">
        💡 等手机 CFC 弹出 <span id="p_savecount" style="color: #5fbcff; font-size: 14px;">—</span> 次"保存到哪里"对话框（每次都选同一个目录）后即可点停止
      </div>
      <div class="row">
        <span><span class="label">当前块:</span> <span class="value" id="p_chunk">—</span></span>
        <span><span class="label">本块帧数:</span> <span class="value" id="p_frame">—</span></span>
        <span><span class="label">总进度:</span> <span class="value" id="p_total">0%</span></span>
        <span><span class="label">已用:</span> <span class="value" id="p_elapsed">—</span></span>
        <span><span class="label">剩余:</span> <span class="value" id="p_eta">—</span></span>
      </div>
      <div class="bar-bg"><div class="bar-fg" id="p_bar"></div></div>
    </div>
  </div>
</div>

<div id="log"></div>

<script>
'use strict';

// ============= 工具函数 =============
function $(id) { return document.getElementById(id); }
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1048576).toFixed(2) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}
function fmtTime(ms) {
  if (!ms || !isFinite(ms)) return '—';
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}h ${m % 60}m ${s % 60}s`;
  if (m > 0) return `${m}m ${s % 60}s`;
  return `${s}s`;
}
function log(msg, cls) {
  const el = $('log');
  const div = document.createElement('div');
  if (cls) div.className = cls;
  const ts = new Date().toLocaleTimeString();
  div.textContent = `[${ts}] ${msg}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  console.log(`[cimbar-bigfile] ${msg}`);
}
async function sha256Hex(uint8) {
  const buf = await crypto.subtle.digest('SHA-256', uint8);
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

// ============= 应用状态 =============
const State = {
  file: null,
  chunks: [],          // Array<Uint8Array>
  manifest: null,      // manifest object (multi-chunk mode 才有, simpleMode 为 null)
  manifestBytes: null, // Uint8Array of JSON-encoded manifest (同上)
  simpleMode: false,   // 文件 ≤ chunk_size 时 true: 单 fountain stream + 原文件名, 无 manifest, 无需拼接
  encodeIdBase: 0,
  // streaming runtime
  // simpleMode: curChunkIndex 0 = 唯一数据 stream
  // multiMode:  curChunkIndex 0 = manifest, 1..N = 数据块
  curChunkIndex: -1,
  framesInChunk: 0,
  framesNeededInChunk: 0,
  totalFramesSent: 0,
  totalFramesNeeded: 0,
  startTime: 0,
  interval: 66,        // ms per frame
  redundancy: 1.5,
  active: false,
  timer: null,
  // 用户主动跳转目标 chunk 索引 (multiMode: 0 = manifest, 1..N = 数据块).
  // 非 null 时 advanceToNextChunk 顶部消费一次后立即清空, 防止下一帧重复跳转.
  jumpRequested: null,
  // 用户手动标记"CFC 已弹保存对话框且完成"的 chunk index 集合 (multi 模式: 0=manifest, 1..N=data).
  // 唯一可信完成信号: CFC 的 ACTION_CREATE_DOCUMENT 弹窗; 用户在 CFC 完成保存后回来点 chunkConfirm 主按钮即加入.
  // 持久化 key = filename + sha256 + chunk_size + chunk_count, 同文件刷新页面能恢复; 内容/切法变后 key 自动错位防误恢复.
  completedChunks: new Set(),
  // 🔒 锁定的 chunk index (-1 = 未锁定). 双击某块设定; advanceToNextChunk 在没有挂起 jump 时
  // 强制 curChunkIndex 停回 lockedChunkIndex, 反复 init+feed 该 stream 生成新 fountain 帧,
  // 使 CFC 弹保存窗时屏幕一定还在播该块, 避免"屏幕≠CFC 完成块"错位.
  // 单击跳转(setJumpTarget)会清锁 = 自由跳到新块; 双击别块 = 转移锁; 双击已锁块 = 解锁.
  lockedChunkIndex: -1,
  // 锁定块的补帧轮数 (lockedChunkIndex >= 0 时累加). 与全文件级 loopCount 解耦: 锁定只在该块上加帧,
  // 不代表"已发完一轮全文件" → 进度面板独立显示"🔒 锁定中 · 补帧 X 次", 不串入"🔁 持续传输中".
  // 解锁/切别块/start/stop/新文件 都清零.
  lockedRefillCount: 0,
};

const ESTIMATED_BYTES_PER_FRAME = 7500; // Mode B default ECC payload

// 三种参数预设. redundancy 数值参考 libcimbar 作者 sz3/libcimbar#165:
// "no penalty for redundant blocks (e.g. 3x or 4x for 10 MB chunks)" — 冗余只增加发送端发帧总数,
// 不影响 CFC 接收完成时间, 所以预设倾向于给足冗余 headroom 兜底.
// balanced: 一般室内光线 + 手持 (默认); aggressive: 屏幕支架 + 良好光线; conservative: 差光线 / 反光 / 手抖
const PRESETS = {
  balanced:     { fps: 15, redundancy: 2.0 },
  aggressive:   { fps: 18, redundancy: 1.5 },
  conservative: { fps: 12, redundancy: 3.0 },
};

// ============= WASM 集成 =============
let wasmReady = false;
let _idealRatio = 1;

// 每侧(横屏)/上下(竖屏)栏的最小留白, 保证跳转列表 + 进度信息可读.
// 宽屏 (≥ ~1334w) 用 200 桌面观感不缩; 窄屏 (低分辨率横屏/平板分屏) 按 mw 的 15% 缩放, 下限 120 兜底.
// 120 = 按钮文字"part0001 🔒"(12px≈70px宽) + .side-panel padding 14×2 + 按钮 padding 10×2 ≈ 118, 兜底刚好容下.
function computeMinPanel(mw) {
  return Math.max(120, Math.min(200, mw * 0.15));
}

// 响应式布局核心: 按 #main 可用空间, 让 canvas 沿"受限维度"按 _idealRatio 最大化,
// 同时给两侧/上下栏各留 MIN_PANEL. center 用 flex:0 0 auto 由 canvas 撑开, 两侧 flex:1 分剩余 — 无循环依赖.
// 必须显式设宽高 (不能用 max-width/height): cimbar 比例由 wasm 决定, 各自独立约束会撕裂比例 → CFC 扫不到 4 角 marker.
function fitCanvas() {
  const canvas = $('canvas');
  const main = $('main');
  if (!canvas || !main) return;
  const mw = main.clientWidth;
  const mh = main.clientHeight;
  if (mw <= 0 || mh <= 0) return;

  // main 更高 = 竖屏(上下栏), 更宽 = 横屏(左右栏). portrait 类让 CSS 把 #main 切成 column.
  // 横屏但宽度放不下两侧栏 (mw-2×minPanel < 80) 时也退化为上下堆叠, 避免窄横屏三栏互相挤压不可用.
  const minPanel = computeMinPanel(mw);
  const portrait = mh > mw || (mw - 2 * minPanel) < 80;
  main.classList.toggle('portrait', portrait);

  const ratio = _idealRatio || 1;   // 码 宽/高 (Mode B = 1, 正方形)
  if (wasmReady && Module._cimbare_rotate_window) {
    Module._cimbare_rotate_window(false);  // 正方形码无需旋转
  }

  let cw, ch;
  if (!portrait) {
    // 横屏: 高度占满, 宽 = 高×ratio, 但宽不挤占左右栏 (各留 minPanel)
    ch = Math.min(mh, (mw - 2 * minPanel) / ratio);
    cw = ch * ratio;
  } else {
    // 竖屏: 宽度占满, 高 = 宽/ratio, 但高不挤占上下栏 (各留 minPanel)
    cw = Math.min(mw, (mh - 2 * minPanel) * ratio);
    ch = cw / ratio;
  }
  cw = Math.max(80, Math.floor(cw));
  ch = Math.max(80, Math.floor(ch));
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
}

window.addEventListener('resize', fitCanvas);

// Pre-define Module so the wasm glue can find it
window.Module = {
  canvas: $('canvas'),
  onRuntimeInitialized: function () {
    log('WASM runtime initialized', 'ok');
    wasmReady = true;
    // Mode B = 68
    Module._cimbare_configure(68, -1);
    log('Configured mode B', 'ok');
    _idealRatio = Module._cimbare_get_aspect_ratio() || 1;
    log('cimbar ideal aspect ratio: ' + _idealRatio.toFixed(4), 'ok');
    fitCanvas();
    updateUiState();
  },
  print: function (text) { log('[wasm] ' + text); },
  printErr: function (text) { log('[wasm err] ' + text, 'err'); },
};

function callInitEncode(filename, encodeId) {
  const fnBytes = new TextEncoder().encode(filename);
  const fnPtr = Module._malloc(fnBytes.length);
  try {
    new Uint8Array(Module.HEAPU8.buffer, fnPtr, fnBytes.length).set(fnBytes);
    const ret = Module._cimbare_init_encode(fnPtr, fnBytes.length, encodeId);
    log(`init_encode("${filename}", id=${encodeId}) → ${ret}`);
    return ret;
  } finally {
    Module._free(fnPtr);
  }
}

function feedAllBytes(uint8) {
  const bufsize = Module._cimbare_encode_bufsize();
  const dataPtr = Module._malloc(bufsize);
  try {
    const wasmView = new Uint8Array(Module.HEAPU8.buffer, dataPtr, bufsize);
    let offset = 0;
    while (offset < uint8.length) {
      const n = Math.min(bufsize, uint8.length - offset);
      wasmView.set(uint8.subarray(offset, offset + n));
      Module._cimbare_encode(dataPtr, n);
      offset += n;
    }
    // Final flush call with len=0 (matches main.js behavior)
    Module._cimbare_encode(dataPtr, 0);
  } finally {
    Module._free(dataPtr);
  }
}

// 根据当前 State (simpleMode / chunks / manifestBytes / redundancy) 同步 UI 文案 + 重算 totalFramesNeeded.
// prepareFile 末尾 + startTransmission 开头都调一次, 双重兜底 race condition (两次 prepareFile 交叉时
// State 字段可能部分覆盖, 这里强制根据当前 State 重新派生所有依赖值).
function applyMode() {
  if (State.chunks.length === 0) return;
  const r = State.redundancy || 1.5;
  if (State.simpleMode) {
    $('m_chunkcount').textContent = `1 个文件 (原文件直发, 无需拼接)`;
    // 注意: 不能引用 p_savecount, 因为下面的 innerHTML 替换会删掉它 (它是 p_hint 的子节点),
    // 第二次调 applyMode 时 $('p_savecount') 就 null 了
    $('p_hint').innerHTML = '💡 手机 CFC 会保存 <b style="color:#5fbcff">1 个文件</b>, 文件名即原文件名, 无需拼接 — 等 CFC 弹出"保存到哪里"对话框并保存后即可点停止';
    State.totalFramesNeeded = framesNeededFor(State.chunks[0].length, r);
  } else {
    const n = State.chunks.length;
    $('m_chunkcount').textContent = `${n + 1} 个文件 (1 manifest.json + ${n} 数据块)`;
    $('p_hint').innerHTML = '💡 等手机 CFC 弹出 <span style="color:#5fbcff;font-size:14px;">' + (n + 1) + '</span> 次"保存到哪里"对话框（每次都选同一个目录）后即可点停止';
    let total = framesNeededFor(State.manifestBytes.length, r);
    for (const c of State.chunks) total += framesNeededFor(c.length, r);
    State.totalFramesNeeded = total;
  }
  // 按钮组随 simpleMode/chunks 变化重渲染 (active 状态由 State.active 决定 disabled)
  renderJumpButtons();
}

// ============= 切片与 manifest 生成 =============
let _preparing = false;
async function prepareFile(file) {
  // 串行化: 防止用户连续拖文件时两次 prepareFile 在 await 间交叉, 导致 State 字段错乱
  if (_preparing) {
    log(`Ignored "${file.name}": still preparing previous file. Try again after current finishes.`, 'err');
    // dropzone 边框闪红 600ms 给用户视觉反馈 (log 面板默认隐藏, 用户看不到 log)
    const dz = $('dropzone');
    const oldBorder = dz.style.borderColor;
    dz.style.borderColor = '#e74c3c';
    setTimeout(() => { dz.style.borderColor = oldBorder; }, 600);
    return;
  }
  _preparing = true;
  try {
    // 失败兜底 + race 防御: 任何后续 await 抛出, 或 await 期间 window-drop handler 先调
    // stopTransmission 让 btnStart 重启, 此时 State.chunks 必须先被清空, 防止用户用旧 chunks 启动新传输
    State.chunks = [];
    State.manifest = null;
    State.manifestBytes = null;
    State.file = null;
    State.simpleMode = false;
    State.jumpRequested = null;
    State.lockedChunkIndex = -1;
    State.lockedRefillCount = 0;
    State.completedChunks = new Set();
    $('btnStart').disabled = true;

    log(`Preparing ${file.name} (${fmtBytes(file.size)})`);
    State.file = file;
    $('m_filename').textContent = file.name;
    $('m_filesize').textContent = fmtBytes(file.size);

    const chunkSize = parseInt($('chunkSize').value, 10);
    const fileBytes = new Uint8Array(await file.arrayBuffer());

    // SHA256 整文件 (UI 展示, simpleMode 不嵌 manifest 但 UI 仍显示)
    const fullSha = await sha256Hex(fileBytes);
    $('m_filehash').textContent = fullSha.substring(0, 16) + '…';

    // encode_id_base: 时间戳低 16 位 (两种模式共用)
    State.encodeIdBase = Math.floor(Date.now() / 1000) & 0xFFFF;
    $('m_encodeid').textContent = State.encodeIdBase;

    State.simpleMode = (file.size <= chunkSize);
    State.redundancy = parseFloat($('redundancy').value) || 1.5;

    if (State.simpleMode) {
      // 单文件直发模式: 1 个 fountain stream, 用原文件名, 无 manifest, CFC 落盘即原文件
      State.chunks = [fileBytes];
      State.manifest = null;
      State.manifestBytes = null;
      log(`Simple mode: single fountain stream, filename "${file.name}", no manifest`, 'ok');
    } else {
      // 多块模式: 切片 + 每块 SHA256 + manifest
      const chunkCount = Math.ceil(file.size / chunkSize);
      const chunks = [];
      const chunkMeta = [];
      for (let i = 0; i < chunkCount; i++) {
        const start = i * chunkSize;
        const end = Math.min(start + chunkSize, file.size);
        const slice = fileBytes.subarray(start, end);
        const sha = await sha256Hex(slice);
        chunks.push(slice);
        chunkMeta.push({ index: i, size: slice.length, sha256: sha });
      }
      State.chunks = chunks;
      State.manifest = {
        version: 1,
        tool: 'cimbar-bigfile',
        filename: file.name,
        total_size: file.size,
        sha256: fullSha,
        chunk_size: chunkSize,
        chunk_count: chunkCount,
        encode_id_base: State.encodeIdBase,
        chunks: chunkMeta,
      };
      State.manifestBytes = new TextEncoder().encode(JSON.stringify(State.manifest));
      log(`Sliced into ${chunkCount} chunks, manifest = ${State.manifestBytes.length} bytes`, 'ok');
    }

    loadCompletedFromStorage();  // multi 模式从 localStorage 恢复; simple 模式直接 reset (key=null 不读)
    applyMode();   // 同步 UI 文案 + 计算 totalFramesNeeded + renderJumpButtons (此时 completed 状态已就绪)
    updateConfirmStats();
  } catch (err) {
    // OOM / arrayBuffer 失败等异常 — 把 UI 一起 reset, 避免半截信息让用户误以为加载成功
    log(`Failed to prepare "${file.name}": ${(err && err.message) || err}`, 'err');
    State.chunks = [];
    State.manifest = null;
    State.manifestBytes = null;
    State.file = null;
    State.simpleMode = false;
    State.jumpRequested = null;
    State.lockedChunkIndex = -1;
    State.lockedRefillCount = 0;
    State.completedChunks = new Set();
    $('m_filename').textContent = '—';
    $('m_filesize').textContent = '—';
    $('m_filehash').textContent = '—';
    $('m_chunkcount').textContent = '—';
    $('m_encodeid').textContent = '—';
  } finally {
    _preparing = false;
    updateUiState();
  }
}

function framesNeededFor(byteCount, redundancy) {
  return Math.max(30, Math.ceil(byteCount / ESTIMATED_BYTES_PER_FRAME * redundancy));
}

// ============= 主循环 =============
function startTransmission() {
  if (!wasmReady || State.chunks.length === 0) {
    log('Cannot start: wasm or file not ready', 'err');
    return;
  }
  State.active = true;
  State.startTime = performance.now();
  State.curChunkIndex = -1;
  State.jumpRequested = null;
  State.lockedChunkIndex = -1;
  State.lockedRefillCount = 0;
  State.totalFramesSent = 0;
  State.loopCount = 0;
  State.lastUiUpdate = 0;
  State.interval = Math.floor(1000 / (parseInt($('fps').value, 10) || 15));
  State.redundancy = parseFloat($('redundancy').value) || 1.5;
  applyMode();   // 兜底重设 UI + 用最新 redundancy 重算 totalFramesNeeded; 同时 renderJumpButtons 用 active=true 渲染可点击按钮
  $('canvas').style.visibility = 'visible';
  $('dropzone').classList.add('hidden');
  $('progress').classList.add('active');
  // chunkConfirm 只在 multi 模式有意义 (simple 模式只有 1 个 stream, 没有"跳下一未完成"概念)
  if (!State.simpleMode) {
    $('chunkConfirm').classList.add('visible');
    updateConfirmStats();
  }
  $('btnStart').disabled = true;
  $('btnStop').disabled = false;
  $('chunkSize').disabled = true;
  // dropzone 隐藏 + 三栏显示后布局落定, canvas 必须重新 fit, 否则尺寸/marker 不对 → CFC 扫不到
  requestAnimationFrame(fitCanvas);
  log(`Starting transmission, interval=${State.interval}ms, redundancy=${State.redundancy}x, mode=${State.simpleMode ? 'simple' : 'multi'}`, 'ok');
  advanceToNextChunk();
  scheduleNextFrame();
}

function stopTransmission() {
  State.active = false;
  State.jumpRequested = null;
  State.lockedChunkIndex = -1;
  State.lockedRefillCount = 0;
  if (State.timer) {
    clearTimeout(State.timer);
    State.timer = null;
  }
  $('btnStop').disabled = true;
  $('chunkSize').disabled = false;
  // 显回 dropzone, 用户可以拖新文件; canvas 隐藏防止旧码图穿过 dropzone margin 露出来
  $('canvas').style.visibility = 'hidden';
  $('dropzone').classList.remove('hidden');
  $('progress').classList.remove('active');
  $('chunkConfirm').classList.remove('visible');
  requestAnimationFrame(fitCanvas);
  // 重渲按钮组让其变 disabled 样式 (State.active=false 已经设置)
  renderJumpButtons();
  updateUiState();
  log('Stopped. 拖入新文件换文件, 或再点开始继续当前文件', 'ok');
}

// ============= 跳转目标列表 (multi 模式专用) =============
// 左栏垂直按钮列表. 单击 = 跳转到该块(自由模式), 双击 / Shift+点击(键盘等效) = 锁定该块(发送端停在此块反复补帧).
// 让 CFC 扫到的必然是目标块, 消除随机扫描等待. simpleMode 下隐藏 (单 stream 跳转无意义).
let _clickTimer = null;  // 区分单击/双击: 单击延迟 500ms 执行 (对齐 Windows 系统 dblclick 阈值上限), 双击到来则取消

function renderJumpButtons() {
  const bar = $('chunkJumpBar');
  clearTimeout(_clickTimer); _clickTimer = null;   // 重建按钮前丢弃挂起的单击, 防旧 idx 的 setJumpTarget 迟到误跳 (如单击后立刻点✅)
  if (State.simpleMode || State.chunks.length === 0) {
    bar.classList.remove('visible');
    bar.innerHTML = '';
    $('jumpTitle').style.display = 'none';   // simpleMode 无跳转概念, 连标题一起隐藏, 避免空标题悬着
    return;
  }
  $('jumpTitle').style.display = '';
  const total = 1 + State.chunks.length;       // 0 = manifest, 1..N = 数据块
  const parts = [];
  // title 让鼠标 hover 看到完整交互说明, 键盘/屏读用户通过 tab focus + accessible name 也能读出
  const titleAttr = ' title="单击跳转 · 双击或 Shift+点击 锁定 🔒"';
  for (let i = 0; i < total; i++) {
    const dis = State.active ? '' : ' disabled';
    parts.push(`<button type="button" data-idx="${i}"${dis}${titleAttr}></button>`);
  }
  bar.innerHTML = parts.join('');
  bar.classList.add('visible');
  bar.querySelectorAll('button[data-idx]').forEach(btn => {
    const idx = parseInt(btn.dataset.idx, 10);
    btn.addEventListener('click', (e) => {
      if (e.detail > 1) return;   // 多击序列的第 2+ 次: 不武装单击定时器, 交给 dblclick (避免与锁定竞态/双击前闪跳)
      // Shift+Click 等效双击锁定 — 给键盘用户 (Tab + Shift+Enter) 一条可达的锁定路径
      if (e.shiftKey) {
        clearTimeout(_clickTimer); _clickTimer = null;
        lockChunk(idx);
        return;
      }
      clearTimeout(_clickTimer);
      // 500ms 对齐 Windows 系统 dblclick 阈值上限 (250ms 太短: 第二次 click 间隔 250-500ms 时
      // 单击定时器已触发 setJumpTarget(清锁+跳), 接着 dblclick 派发 lockChunk → 视觉抖动)
      _clickTimer = setTimeout(() => { _clickTimer = null; setJumpTarget(idx); }, 500);
    });
    btn.addEventListener('dblclick', () => {
      clearTimeout(_clickTimer); _clickTimer = null;
      lockChunk(idx);
    });
  });
  renderChunkButtonStates();  // 填入文案 + 初始状态 (completed / locked 等)
}

// 单击: 跳转到 idx 并进入自由模式 (清除锁定). 立即 advance 切换, active 高亮随即跟到该块 = 屏幕实际播放.
function setJumpTarget(idx) {
  if (!State.active) return;
  State.jumpRequested = idx;
  State.lockedChunkIndex = -1;
  State.lockedRefillCount = 0;
  log(`跳转到 ${chunkIndexLabel(idx)}`, 'ok');
  advanceToNextChunk();   // 立即切换, 不等当前块发完估算帧 — 否则 10MB 块要等数分钟才换 (即"点了不动")
}

// 双击: 切换锁定. 双击已锁块 = 解锁; 双击其他块 = 锁定它(并跳过去, 转移锁).
function lockChunk(idx) {
  if (!State.active) return;
  if (State.lockedChunkIndex === idx) {
    State.lockedChunkIndex = -1;
    State.lockedRefillCount = 0;
    log(`🔓 解锁 ${chunkIndexLabel(idx)}, 恢复自由循环`, 'ok');
    renderChunkButtonStates();
  } else {
    State.lockedChunkIndex = idx;
    State.lockedRefillCount = 0;   // 切到新锁定块, 补帧计数从 0 重新开始
    State.jumpRequested = idx;
    log(`🔒 锁定 ${chunkIndexLabel(idx)}, 发送端停在该块反复补帧`, 'ok');
    advanceToNextChunk();   // 立即切到并锁定
  }
}

// 统一渲染所有按钮状态. active 严格跟随 State.curChunkIndex (真正在播的块) — 单击/双击都立即 advance,
// 切换瞬时完成, 故 active 永远 = 屏幕实际播放, 无显示超前歧义. locked 跟随 lockedChunkIndex.
function renderChunkButtonStates() {
  const bar = $('chunkJumpBar');
  if (!bar) return;
  bar.querySelectorAll('button[data-idx]').forEach(btn => {
    const i = parseInt(btn.dataset.idx, 10);
    const isLocked = i === State.lockedChunkIndex;
    btn.classList.toggle('active', i === State.curChunkIndex);
    btn.classList.toggle('locked', isLocked);
    btn.classList.toggle('completed', State.completedChunks.has(i));
    btn.textContent = chunkIndexLabel(i) + (isLocked ? ' 🔒' : '');
  });
}

// ============= 已保存进度持久化 =============
// 唯一可信"完成"信号是 CFC ACTION_CREATE_DOCUMENT 对话框, 由用户手动点 chunkConfirm 按钮告知发送端.
// 持久化用 localStorage, key 绑定 manifest 的 sha256 + chunk_size, 同文件刷新页面可恢复;
// 内容/切法改变时 key 自动错位, 不会错恢复 stale completedChunks.
function getProgressStorageKey() {
  if (State.simpleMode || !State.manifest) return null;
  // 不含 encodeIdBase: 每次 prepareFile 都基于时间戳重生成, 写进 key 会让"同文件刷新后恢复进度"功能失效.
  // 必须含 sha256 + chunk_size 否则会错恢复 stale 进度 (codex review #3 P2 指出的两个 collision 场景):
  //   1) 同名 + 同字节长度 + 不同内容: filename/chunk_count/total_size 全一致, 但内容已变 → 跳过这些块不发, CFC 收到的 chunk hash 与 manifest 对不上 → reassemble 失败
  //   2) 同 chunk_count + 不同 chunk_size: 例如 18MB 文件用 10MB/12MB 切都 = 2 块, 切片边界不同 → 同样错恢复
  // 加 sha256 区分 (1), 加 chunk_size 区分 (2); filename 保留作可读性方便调试 localStorage.
  return `cimbar-bigfile:saved:${State.manifest.filename}:${State.manifest.sha256}:${State.manifest.chunk_size}:${State.manifest.chunk_count}`;
}

function loadCompletedFromStorage() {
  State.completedChunks = new Set();
  const key = getProgressStorageKey();
  if (!key) return;
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    const total = 1 + State.chunks.length;
    for (const n of arr) {
      if (Number.isInteger(n) && n >= 0 && n < total) State.completedChunks.add(n);
    }
    if (State.completedChunks.size > 0) {
      log(`恢复 ${State.completedChunks.size} 块已保存进度 (来自上次会话)`, 'ok');
    }
  } catch (e) {
    log(`读取已保存进度失败: ${e.message}`, 'warn');
  }
}

function saveCompletedToStorage() {
  const key = getProgressStorageKey();
  if (!key) return;
  try {
    localStorage.setItem(key, JSON.stringify([...State.completedChunks].sort((a, b) => a - b)));
  } catch (e) {
    log(`保存进度失败: ${e.message}`, 'warn');
  }
}

function updateConfirmStats() {
  if (State.simpleMode || State.chunks.length === 0) {
    $('confirmStats').textContent = '0 / 0 已保存';
    return;
  }
  const total = 1 + State.chunks.length;
  $('confirmStats').textContent = `${State.completedChunks.size} / ${total} 已保存`;
}

function chunkIndexLabel(idx) {
  if (idx === 0) return 'manifest';
  const padW = State.chunks.length < 100 ? 2 : (State.chunks.length < 1000 ? 3 : 4);
  return `part${String(idx - 1).padStart(padW, '0')}`;
}

function markCurrentChunkCompleted() {
  if (!State.active || State.simpleMode) return;
  const cur = State.curChunkIndex;
  if (cur < 0) return;
  const total = 1 + State.chunks.length;
  State.completedChunks.add(cur);
  saveCompletedToStorage();
  log(`已标记 "${chunkIndexLabel(cur)}" 为已保存 (${State.completedChunks.size}/${total})`, 'ok');
  // 只改 completedChunks 状态, 用 renderChunkButtonStates 轻量同步 class/textContent;
  // 不调 renderJumpButtons 重建 DOM, 否则会丢挂起的单击定时器 + 50 块时重绑 listener 有 jank.
  renderChunkButtonStates();
  updateConfirmStats();

  // 从 cur+1 开始环形查找下一个未完成块
  let next = -1;
  for (let i = 1; i <= total; i++) {
    const idx = (cur + i) % total;
    if (!State.completedChunks.has(idx)) { next = idx; break; }
  }
  if (next === -1) {
    log('✅ 全部块都已标记为已保存! 现在可以点"停止"了～', 'ok');
    return;
  }
  setJumpTarget(next);   // setJumpTarget 内部已立即 advance — 用户已确认收到, 不等当前块发完估算帧
}

function resetCompleted() {
  if (State.simpleMode || State.chunks.length === 0) return;
  if (State.completedChunks.size === 0) {
    log('当前没有已保存的块', 'warn');
    return;
  }
  const prevCount = State.completedChunks.size;
  State.completedChunks = new Set();
  saveCompletedToStorage();
  // 同上: 只改状态用 renderChunkButtonStates, 不重建 DOM
  renderChunkButtonStates();
  updateConfirmStats();
  log(`已清空 ${prevCount} 块已保存标记`, 'ok');
}

function advanceToNextChunk() {
  // 跳转处理: jumpRequested 非空 → 强制把 curChunkIndex 设为 target-1, 让下一行 += 1 自然命中 target.
  // simpleMode 下按钮组隐藏不可能触发, 但仍兜底清空. 跳转优先级 > 锁定.
  if (State.jumpRequested !== null) {
    if (!State.simpleMode) {
      const target = State.jumpRequested;
      State.curChunkIndex = target - 1;
      log(`>>> 跳转到 ${chunkIndexLabel(target)}`, 'ok');
    }
    State.jumpRequested = null;
  } else if (State.lockedChunkIndex >= 0 && !State.simpleMode) {
    // 🔒 锁定 + 无挂起跳转: 强制停回 lockedChunkIndex (而非随当前块), 重新 init+feed 该 stream 生成新 fountain 帧.
    // 这样 CFC 弹保存窗时屏幕一定还在播该块, 用户点 ✅ 标记的就是 CFC 实际保存的块.
    // 用 lockedRefillCount 而非 loopCount: 锁定只在该块上加帧, 不代表"已发完一轮全文件",
    // 进度面板因此可区分"🔒 锁定中"和"🔁 全文件循环补帧中", 不再混语义.
    State.curChunkIndex = State.lockedChunkIndex - 1;
    State.lockedRefillCount += 1;
    // 长时间锁定时每轮 advanceToNextChunk 都打 log 会刷屏 (10MB 块 ~150 帧 @15fps = 10s/轮 → 10 分钟刷 60 行);
    // 关键节点 (第 1 轮 + 每 10 轮) 打 log 即可, 进度面板的 p_eta 始终显示实时补帧次数兜底.
    if (State.lockedRefillCount === 1 || State.lockedRefillCount % 10 === 0) {
      log(`🔒 锁定 ${chunkIndexLabel(State.lockedChunkIndex)}, 补帧第 ${State.lockedRefillCount} 轮`, 'ok');
    }
  }

  State.curChunkIndex += 1;
  State.framesInChunk = 0;

  if (State.simpleMode) {
    // 单文件模式: 只 1 个 stream, 反复循环用原文件名
    if (State.curChunkIndex >= 1) {
      State.loopCount = (State.loopCount || 0) + 1;
      log(`Single-file stream sent ${State.loopCount}× round(s). Looping.`, 'ok');
      State.curChunkIndex = 0;
    }
    const chunk = State.chunks[0];
    callInitEncode(State.file.name, State.encodeIdBase + 0);
    feedAllBytes(chunk);
    State.framesNeededInChunk = framesNeededFor(chunk.length, State.redundancy);
    log(`>>> Sending "${State.file.name}" (${fmtBytes(chunk.length)}, ~${State.framesNeededInChunk} frames, simple mode)`, 'ok');
    return;
  }

  // 多块模式: 0 = manifest, 1..N = data chunks
  const total = 1 + State.chunks.length;
  if (State.curChunkIndex >= total) {
    // 关键: manifest 必须在循环里, 晚到的 CFC 才能拿到 manifest 识别 chunk 命名
    State.loopCount = (State.loopCount || 0) + 1;
    log(`All streams sent ${State.loopCount}× round(s). Looping back to manifest.`, 'ok');
    State.curChunkIndex = 0;
    State.framesInChunk = 0;
  }

  if (State.curChunkIndex === 0) {
    callInitEncode('manifest.json', State.encodeIdBase + 0);
    feedAllBytes(State.manifestBytes);
    State.framesNeededInChunk = framesNeededFor(State.manifestBytes.length, State.redundancy);
    log(`>>> Sending manifest (${State.manifestBytes.length} bytes, ~${State.framesNeededInChunk} frames)`, 'ok');
  } else {
    const dataIdx = State.curChunkIndex - 1;
    const chunk = State.chunks[dataIdx];
    const basename = stripExt(State.manifest.filename);
    const padW = State.chunks.length < 100 ? 2 : (State.chunks.length < 1000 ? 3 : 4);
    const partName = `${basename}.part${String(dataIdx).padStart(padW, '0')}.bin`;
    callInitEncode(partName, State.encodeIdBase + 1 + dataIdx);
    feedAllBytes(chunk);
    State.framesNeededInChunk = framesNeededFor(chunk.length, State.redundancy);
    log(`>>> Chunk ${dataIdx + 1}/${State.chunks.length} "${partName}" (${fmtBytes(chunk.length)}, ~${State.framesNeededInChunk} frames)`, 'ok');
  }

  // 按钮状态跟随当前实际播放的 chunk (跳转 / 自然推进 / 循环回 manifest / 锁定补帧都同步).
  // active 在此刻才点亮 = 真正切到该块, 与屏幕实际播放严格一致, 无显示超前歧义.
  renderChunkButtonStates();
}

function stripExt(filename) {
  const lastDot = filename.lastIndexOf('.');
  return lastDot > 0 ? filename.substring(0, lastDot) : filename;
}

function scheduleNextFrame() {
  if (!State.active) return;
  const start = performance.now();

  Module._cimbare_render();
  Module._cimbare_next_frame(false);
  State.framesInChunk += 1;
  State.totalFramesSent += 1;

  // 检查当前 chunk 是否已发够帧数
  if (State.framesInChunk >= State.framesNeededInChunk) {
    advanceToNextChunk();
  }

  // UI 更新限频到每秒一次，避免抖动
  const now = performance.now();
  if (now - State.lastUiUpdate >= 1000) {
    State.lastUiUpdate = now;
    updateProgressUI();
  }

  const elapsed = performance.now() - start;
  const next = Math.max(0, State.interval - elapsed);
  State.timer = setTimeout(scheduleNextFrame, next);
}

// ============= UI =============
function updateUiState() {
  const ready = wasmReady && State.chunks.length > 0;
  $('btnStart').disabled = !ready || State.active;
}

function updateProgressUI() {
  // active 守卫 belt-and-suspenders: lockedChunkIndex 只在传输中有意义, 非 active 时即使残留 >=0 也不应进入锁定分支
  const isLocked = State.active && State.lockedChunkIndex >= 0 && !State.simpleMode;

  let curHuman;
  if (State.simpleMode) {
    curHuman = `1/1${State.loopCount > 0 ? ` (第 ${State.loopCount + 1} 轮)` : ''}`;
  } else if (State.curChunkIndex === 0) {
    curHuman = `manifest${State.loopCount > 0 ? ` (第 ${State.loopCount + 1} 轮)` : ''}`;
  } else {
    curHuman = `${State.curChunkIndex}/${State.chunks.length}${State.loopCount > 0 ? ` (第 ${State.loopCount + 1} 轮)` : ''}`;
  }
  // 锁定状态集中在 p_total ("🔒 锁定 partXX") + p_eta ("补帧 N 轮"), p_chunk 不再重复加 🔒×N 减视觉噪声
  $('p_chunk').textContent = curHuman;
  $('p_frame').textContent = `${State.framesInChunk}/${State.framesNeededInChunk}`;

  // 三态语义: 锁定中(忽略全文件进度) → 已循环过(已过首轮) → 首轮(显示真实%/ETA)
  const elapsedMs = performance.now() - State.startTime;
  $('p_elapsed').textContent = fmtTime(elapsedMs);

  if (isLocked) {
    // 锁定模式: 全文件进度此时无意义 (用户已显式让发送端专攻一块, 不再均匀推进各 chunk).
    // 进度条占满 + 文案显式说明锁定状态, 防止与"🔁 持续传输中"(全文件循环)混淆.
    $('p_total').textContent = `🔒 锁定 ${chunkIndexLabel(State.lockedChunkIndex)}`;
    $('p_bar').style.width = '100%';
    $('p_eta').textContent = `补帧 ${State.lockedRefillCount} 轮, 解锁/切别块即可继续`;
  } else if (State.loopCount === 0) {
    const pct = Math.min(100, (State.totalFramesSent / State.totalFramesNeeded) * 100);
    $('p_total').textContent = pct.toFixed(1) + '%';
    $('p_bar').style.width = pct + '%';

    if (State.totalFramesSent > 30) {
      const eta = (elapsedMs / State.totalFramesSent) * (State.totalFramesNeeded - State.totalFramesSent);
      $('p_eta').textContent = '首轮约 ' + fmtTime(eta);
    }
  } else {
    $('p_total').textContent = '🔁 持续传输中';
    $('p_bar').style.width = '100%';
    $('p_eta').textContent = '循环补帧中, 可随时停止';
  }
}

// ============= 预设 & 吞吐提示 =============
// 选预设 → 把 PRESETS[name] 写回 fps/redundancy 输入框, 同步刷新吞吐区间.
// 用户手动改 fps/redundancy → 把 preset select 切到 "custom" (不强行追溯匹配某个预设).
function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;  // "custom" 不动 input
  $('fps').value = p.fps;
  $('redundancy').value = p.redundancy;
  updateThroughputHint();
}

// 物理上限 = fps × 7500B/帧; 跑满冗余时有效吞吐 = 物理上限 / 冗余倍数.
// wirehair 实际只需 ~1.05x overhead 即可解码, CFC 提前收齐后吞吐接近物理上限.
function updateThroughputHint() {
  const fps = parseInt($('fps').value, 10) || 15;
  const r   = parseFloat($('redundancy').value) || 1.5;
  const physMax    = fps * ESTIMATED_BYTES_PER_FRAME / 1024;
  const effectiveMin = physMax / r;
  $('throughputHint').textContent = `预期 ~${effectiveMin.toFixed(0)}–${physMax.toFixed(0)} KB/s`;
}

// ============= 事件绑定 =============
$('dropzone').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (f) await prepareFile(f);
});
$('dropzone').addEventListener('dragover', (e) => {
  e.preventDefault();
  $('dropzone').classList.add('dragover');
});
$('dropzone').addEventListener('dragleave', () => {
  $('dropzone').classList.remove('dragover');
});
$('dropzone').addEventListener('drop', async (e) => {
  e.preventDefault();
  $('dropzone').classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) await prepareFile(f);
});

$('btnStart').addEventListener('click', startTransmission);
$('btnStop').addEventListener('click', stopTransmission);
$('btnDebug').addEventListener('click', () => $('log').classList.toggle('active'));
$('btnConfirmChunk').addEventListener('click', markCurrentChunkCompleted);
$('btnResetCompleted').addEventListener('click', resetCompleted);

$('preset').addEventListener('change', (e) => applyPreset(e.target.value));
// 用户手动改 → 切到 custom 表明已经偏离预设; setValue (applyPreset) 不会触发 input 事件, 不会循环
$('fps').addEventListener('input', () => { $('preset').value = 'custom'; updateThroughputHint(); });
$('redundancy').addEventListener('input', () => { $('preset').value = 'custom'; updateThroughputHint(); });
updateThroughputHint();

// 全局 dragover 防止浏览器把文件当 URL 打开
window.addEventListener('dragover', (e) => e.preventDefault());
// 全局 drop 兜底: dropzone 可见时它自己处理 (事件冒泡到 window 时直接跳过);
// dropzone 隐藏 (传输中) 时, 用户拖文件直接接管: 自动停 + 加载新文件
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  if (!$('dropzone').classList.contains('hidden')) return;
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (State.active) {
    stopTransmission();
    log('Auto-stopped previous transmission to load new file', 'ok');
  }
  await prepareFile(f);
  log(`Loaded "${f.name}" (${fmtBytes(f.size)}). Click 开始传输 to start.`, 'ok');
});

log('Page loaded, waiting for wasm runtime...');
</script>
